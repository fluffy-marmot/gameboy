<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gameboy Emulator</title>
    <link rel="stylesheet" href="styles.css">
    <script type="module" src="10_main.mjs"></script>
</head>
<body>

    <button id="sidebar-toggle" class="icon-button" aria-pressed="false" aria-label="Toggle Sidebar"></button>
    <div id="sidebar-trigger"></div>
    <nav id="sidebar">
        <div id="sidebar-main-content">

            <details id="section-palette" open><summary>🎨 Palette</summary>
            <div id="sidebar-palette-content">
                <div class="palette-select selected">
                    <div class="palette-clr clr0" data-color="FFBFFFF4"></div>
                    <div class="palette-clr clr1" data-color="FF41D99A"></div>
                    <div class="palette-clr clr2" data-color="FF578060"></div>
                    <div class="palette-clr clr3" data-color="FF402B00"></div>
                </div>
                <div class="palette-select">
                    <div class="palette-clr clr0" data-color="FF0FBC9B"></div>
                    <div class="palette-clr clr1" data-color="FF0FAC8B"></div>
                    <div class="palette-clr clr2" data-color="FF306230"></div>
                    <div class="palette-clr clr3" data-color="FF0F380F"></div>
                </div>
                <div class="palette-select">
                    <div class="palette-clr clr0" data-color="FFFFFFFF"></div>
                    <div class="palette-clr clr1" data-color="FFAAAAAA"></div>
                    <div class="palette-clr clr2" data-color="FF555555"></div>
                    <div class="palette-clr clr3" data-color="FF000000"></div>
                </div>
                <div class="palette-select">
                    <div id="custom-clr0" class="palette-clr clr0"></div>
                    <div id="custom-clr1" class="palette-clr clr1"></div>
                    <div id="custom-clr2" class="palette-clr clr2"></div>
                    <div id="custom-clr3" class="palette-clr clr3"></div>
                </div>
            </div>

            </details>
            <details id="section-joypad"><summary>🕹️ Joypad</summary>
            <div id="sidebar-joypad-content">
                <div class="joypad-row" data-control="up">
                    <span class="joypad-label">Up</span>
                    <span class="joypad-key"><span class="joypad-key-pill"></span></span>
                    <button class="icon-button joypad-update" aria-label="Edit Input"></button>
                </div>
                <div class="joypad-row" data-control="down">
                    <span class="joypad-label">Down</span>
                    <span class="joypad-key"><span class="joypad-key-pill"></span></span>
                    <button class="icon-button joypad-update" aria-label="Edit Input"></button>
                </div>
                <div class="joypad-row" data-control="left">
                    <span class="joypad-label">Left</span>
                    <span class="joypad-key"><span class="joypad-key-pill"></span></span>
                    <button class="icon-button joypad-update" aria-label="Edit Input"></button>
                </div>
                <div class="joypad-row" data-control="right">
                    <span class="joypad-label">Right</span>
                    <span class="joypad-key"><span class="joypad-key-pill"></span></span>
                    <button class="icon-button joypad-update" aria-label="Edit Input"></button>
                </div>
                <div class="joypad-row" data-control="a">
                    <span class="joypad-label">A</span>
                    <span class="joypad-key"><span class="joypad-key-pill"></span></span>
                    <button class="icon-button joypad-update" aria-label="Edit Input"></button>
                </div>
                <div class="joypad-row" data-control="b">
                    <span class="joypad-label">B</span>
                    <span class="joypad-key"><span class="joypad-key-pill"></span></span>
                    <button class="icon-button joypad-update" aria-label="Edit Input"></button>
                </div>
                <div class="joypad-row" data-control="start">
                    <span class="joypad-label">Start</span>
                    <span class="joypad-key"><span class="joypad-key-pill"></span></span>
                    <button class="icon-button joypad-update" aria-label="Edit Input"></button>
                </div>
                <div class="joypad-row" data-control="select">
                    <span class="joypad-label">Select</span>
                    <span class="joypad-key"><span class="joypad-key-pill"></span></span>
                    <button class="icon-button joypad-update" aria-label="Edit Input"></button>
                </div>
            </div>
            </details>

            <div id="sidebar-roms-content">
            <details id="section-lib-user" class="main-node" open><summary>💾 My ROMs</summary></details>
            <details id="section-lib-server" class="main-node" open><summary>📦 Server ROMs</summary></details>
            <details id="section-lib-tests" class="main-node"><summary>📋 Test ROMs</summary></details>
            </div>
        </div>

        <div id="sidebar-footer">
            <div id="footer-buttons">
                <button id="header-button" class="icon-button" aria-label="Header Info"></button>
                <button id="upload-rom-button" class="icon-button" aria-label="Upload ROM"></button>
                <button id="fullscreen-button" class="icon-button" aria-label="Fullscreen"></button>
                <a href="https://github.com/fluffy-marmot/gameboy" target="_blank" id="github-button"
                    class="btn" aria-label="Github Link"></a>

                <input type="file" id="upload-rom-input" accept=".gb">
            </div>
            <div id="volume-container">
                <label id="volume-control"><div id="volume-icon"></div>
                    <input id="volume-slider" type="range" min="0" max="1.0" step="0.01" value="1.0">
                </label>
            </div>
        </div>
    </nav>

    <div id="background-container">
        <div id="lcd-container">
            <canvas id="canvas-lcd" width="160" height="144"></canvas>
            <canvas class="canvas-header lcd-overlay visible" width="160" height="144"></canvas>
            <canvas class="canvas-info lcd-overlay" width="160" height="144"></canvas>
        </div>
    </div>
</body>
</html>
