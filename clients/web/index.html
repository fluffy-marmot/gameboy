<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gameboy Emulator</title>
    <link rel="stylesheet" href="styles.css">
    <script type="module" src="10_main.mjs"></script>
</head>
<body>

    <button id="sidebar-toggle" class="icon-button" aria-pressed="false" aria-label="toggle-menu"></button>
    <div id="sidebar-trigger"></div>
    <nav id="sidebar">
        <div id="sidebar-main-content">
            <details open><summary>🎨 Palette</summary>
            <div id="sidebar-palette-content">
                <div class="palette-select selected">
                    <div class="palette-clr clr0" data-color="FFBFFFF4"></div>
                    <div class="palette-clr clr1" data-color="FF41D99A"></div>
                    <div class="palette-clr clr2" data-color="FF578060"></div>
                    <div class="palette-clr clr3" data-color="FF402B00"></div>
                </div>
                <div class="palette-select">
                    <div class="palette-clr clr0" data-color="FF0FBC9B"></div>
                    <div class="palette-clr clr1" data-color="FF0FAC8B"></div>
                    <div class="palette-clr clr2" data-color="FF306230"></div>
                    <div class="palette-clr clr3" data-color="FF0F380F"></div>
                </div>
                <div class="palette-select">
                    <div class="palette-clr clr0" data-color="FFFFFFFF"></div>
                    <div class="palette-clr clr1" data-color="FFAAAAAA"></div>
                    <div class="palette-clr clr2" data-color="FF555555"></div>
                    <div class="palette-clr clr3" data-color="FF000000"></div>
                </div>
                <div class="palette-select">
                    <div class="palette-clr clr0" data-color="FFFFFFFF"></div>
                    <div class="palette-clr clr1" data-color="FFFFFF00"></div>
                    <div class="palette-clr clr2" data-color="FFFF00FF"></div>
                    <div class="palette-clr clr3" data-color="FF000000"></div>
                </div>
            </div>
            </details>

            <div id="sidebar-roms-content"></div>
        </div>

        <div id="sidebar-footer">
            <div id="footer-buttons">
                <button id="header-button" class="icon-button" aria-pressed="false" aria-label="header-info"></button>
            </div>
            <div id="volume-container">
                <label id="volume-control"><div id="volume-icon"></div>
                    <input id="volume-slider" type="range" min="0" max="1.0" step="0.01" value="1.0">
                </label>
            </div>
        </div>
    </nav>

    <div id="background-container">
        <div id="lcd-container">
            <canvas id="canvas-lcd" width="160" height="144"></canvas>
            <canvas id="canvas-header" width="160" height="144"></canvas>
        </div>
    </div>
</body>
</html>
